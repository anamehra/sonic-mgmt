version: 2.0

services: {default: !include sonic_services.yaml}

params: !include sonic_params.yaml
builds: !include sonic_builds.yaml
speeds: !include sonic_speeds.yaml
errors: !include sonic_errors.yaml
instrument: !include sonic_instrument.yaml

configs:
    default: !include sonic_configs.yaml
    empty: {current: [], restore: []}

devices:
    cmono_hbm:
        device_type: DevSonic
        access: {protocol: ssh, ip: 1.74.23.32, port: 22}
        credentials: {username: admin, password: password, altpassword: YourPaSsWoRd}
        properties: {config: default, build: default, services: default, params: def_dut, speed: default}
    cmono1:
        device_type: DevSonic
        access: {protocol: ssh, ip: 1.74.23.223, port: 22}
        credentials: {username: admin, password: password, altpassword: YourPaSsWoRd}
        properties: {config: default, build: default, services: default, params: def_dut, speed: default}
    stc:
       device_type: TGEN
       properties: {type: stc, version: 5.45, ip: 172.27.147.23}

topology:
    cmono_hbm:
        interfaces:
            Ethernet120: {EndDevice: stc, EndPort: 11/9, params: def_tg_link} # 400G port
            Ethernet80: {EndDevice: stc, EndPort: 3/25, params: def_tg_link} # 100G port
    cmono1:
        interfaces:
            Ethernet96: {EndDevice: cmono_hbm, EndPort: Ethernet96, params: def_link}
            Ethernet120: {EndDevice: stc, EndPort: 11/1, params: def_tg_link} # 400G port
