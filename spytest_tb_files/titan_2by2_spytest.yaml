version: 2.0

services: {default: !include sonic_services.yaml}

params: !include sonic_params.yaml
builds: !include sonic_builds.yaml
speeds: !include sonic_speeds.yaml
errors: !include sonic_errors.yaml
# instrument: !include sonic_instrument.yaml

configs:
    # default: !include sonic_configs.yaml
    empty: {current: [], restore: []}

devices:
    DUT1:
        device_type: DevSonic
        access: {protocol: ssh, ip: 172.25.164.42, port: 22}
        credentials: {username: admin, password: password, altpassword: password}
        properties: {config: default, build: default, services: default, params: def_dut, speed: default}
    DUT2:
        device_type: DevSonic
        access: {protocol: ssh, ip: 172.25.164.43, port: 22}
        credentials: {username: admin, password: password, altpassword: password}
        properties: {config: default, build: default, services: default, params: def_dut, speed: default}
    T1:
       device_type: TGEN
       properties: {type: stc, version: 5.57, ip: ["172.25.164.76"]}

topology:
    DUT1:
        interfaces:
            Ethernet496: {EndDevice: T1, EndPort: 1/2/1, params: def_tg_link}
            Ethernet504: {EndDevice: T1, EndPort: 1/2/5, params: def_tg_link}
            Ethernet32:  {EndDevice: DUT2, EndPort: Ethernet32, params: def_link}
            Ethernet40:  {EndDevice: DUT2, EndPort: Ethernet40, params: def_link}
    DUT2:
        interfaces:
            Ethernet496: {EndDevice: T1, EndPort: 1/1/1, params: def_tg_link}
            Ethernet504: {EndDevice: T1, EndPort: 1/1/5, params: def_tg_link}
            Ethernet32:  {EndDevice: DUT1, EndPort: Ethernet32, params: def_link}
            Ethernet40:  {EndDevice: DUT1, EndPort: Ethernet40, params: def_link}
